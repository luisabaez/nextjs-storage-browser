# ============================================================================
# GITHUB ACTIONS WORKFLOW: Deploy Lambda Function
# ============================================================================
#
# WHAT THIS DOES:
# ---------------
# When you push changes to the Lambda/ folder in GitHub, this workflow
# automatically deploys your Python code to the appropriate Lambda function
# based on the branch:
#   - main branch    → deploys to "TestFunction" (PRODUCTION)
#   - develop branch → deploys to "Hacienda-ERP-FileBrowser-Develop" (DEV)
#
# HOW IT WORKS:
# -------------
# 1. Determines which Lambda to deploy based on branch name
# 2. Packages all Python files from Lambda/ folder into a single zip
# 3. Uploads the zip to the appropriate Lambda in AWS
#
# WHICH FILE RUNS?
# ----------------
# The "Handler" setting in AWS Lambda determines which file runs.
# For example:
#   - Handler: relocate_file.lambda_handler → runs relocate_file.py
#   - Handler: validate_headers.lambda_handler → runs validate_headers.py
#
# ============================================================================

name: Deploy Lambda Function

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      # Only runs when Lambda folder changes
      - 'Lambda/**'

  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.11'

jobs:
  # ==========================================================================
  # JOB: PACKAGE AND DEPLOY
  # ==========================================================================
  deploy:
    name: Package and Deploy Lambda
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------------
      # STEP 1: Checkout the repository
      # ----------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # STEP 2: Determine Lambda function name based on branch
      # ----------------------------------------------------------------------
      - name: Set Lambda Function Name
        id: set-lambda
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "LAMBDA_FUNCTION_NAME=TestFunction" >> $GITHUB_ENV
            echo "ENVIRONMENT=PRODUCTION" >> $GITHUB_ENV
            echo "Deploying to PRODUCTION Lambda: TestFunction"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "LAMBDA_FUNCTION_NAME=Hacienda-ERP-FileBrowser-Develop" >> $GITHUB_ENV
            echo "ENVIRONMENT=DEVELOPMENT" >> $GITHUB_ENV
            echo "Deploying to DEVELOPMENT Lambda: Hacienda-ERP-FileBrowser-Develop"
          else
            echo "Unknown branch - skipping deployment"
            exit 1
          fi

      # ----------------------------------------------------------------------
      # STEP 3: Set up Python
      # ----------------------------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ----------------------------------------------------------------------
      # STEP 4: Install dependencies (if requirements.txt exists)
      # ----------------------------------------------------------------------
      - name: Install Dependencies
        run: |
          if [ -f "Lambda/requirements.txt" ]; then
            echo "Installing dependencies from requirements.txt..."
            pip install -r Lambda/requirements.txt -t Lambda/
          else
            echo "No requirements.txt found - skipping"
          fi

      # ----------------------------------------------------------------------
      # STEP 5: Create deployment package (zip file)
      # ----------------------------------------------------------------------
      - name: Create Deployment Package
        run: |
          echo "========================================"
          echo "Creating Lambda deployment package..."
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Target Lambda: ${{ env.LAMBDA_FUNCTION_NAME }}"
          echo "========================================"

          cd Lambda

          echo ""
          echo "Files being packaged:"
          echo "---------------------"
          ls -la *.py

          # Create zip with all Python files
          zip -r ../lambda-package.zip .

          cd ..

          echo ""
          echo "========================================"
          echo "Package created successfully!"
          ls -lh lambda-package.zip
          echo "========================================"

      # ----------------------------------------------------------------------
      # STEP 6: Configure AWS credentials
      # ----------------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------------------
      # STEP 7: Deploy to AWS Lambda
      # ----------------------------------------------------------------------
      - name: Deploy to AWS Lambda
        run: |
          echo "========================================"
          echo "Deploying to Lambda: ${{ env.LAMBDA_FUNCTION_NAME }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "========================================"

          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda-package.zip \
            --publish

          echo ""
          echo "========================================"
          echo "DEPLOYMENT SUCCESSFUL!"
          echo "========================================"

      # ----------------------------------------------------------------------
      # STEP 8: Show deployment info
      # ----------------------------------------------------------------------
      - name: Verify Deployment
        run: |
          echo "========================================"
          echo "Lambda Function Details:"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "========================================"

          aws lambda get-function \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --query 'Configuration.[FunctionName,Runtime,Handler,LastModified,CodeSize]' \
            --output table

          echo ""
          echo "========================================"

# ============================================================================
# BRANCH → LAMBDA MAPPING
# ============================================================================
#
#   ┌─────────────────────────────────────────────────────────────────────┐
#   │  BRANCH        │  LAMBDA FUNCTION                  │  ENVIRONMENT   │
#   ├─────────────────────────────────────────────────────────────────────┤
#   │  main/master   │  TestFunction                     │  PRODUCTION    │
#   │  develop       │  Hacienda-ERP-FileBrowser-Develop │  DEVELOPMENT   │
#   └─────────────────────────────────────────────────────────────────────┘
#
#   S3 Bucket Triggers:
#   - hacienda-erp-dev → triggers Hacienda-ERP-FileBrowser-Develop
#   - hacienda-erp-prd → triggers TestFunction (or Validation_FileHeaders)
#
# ============================================================================
